name: Test and deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-production
  cancel-in-progress: true

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Add this URL as a GitHub Actions repository secret.
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
    defaults:
      run:
        working-directory: server
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install backend dependencies
        run: npm install

      - name: Run backend tests
        run: npm test

      - name: Trigger Render deployment
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Render hook is not configured
        if: ${{ env.RENDER_DEPLOY_HOOK_URL == '' }}
        run: echo "Set RENDER_DEPLOY_HOOK_URL to enable deployment after tests."
